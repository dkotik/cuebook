<!doctype html>
<html lang="{{ site.Language.Locale | default `en-US` }}" class="theme-light">
  <head>
    <!-- built with Hugo from internal/documentation -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ `favicon.svg` | relURL }}">
    <link rel="stylesheet" href="{{ `bulma.min.css` | relURL }}">
    <!--<script src="{{ `htmx.min.js` | relURL }}"></script>-->
    <!-- Include the Go WASM runtime bridge -->
    <style>
      html, body {
        overscroll-behavior: none;
      }

      main {
        min-height: 75vh;
      }

      ul.menu-list li+li {
        margin-top: 0.4rem;
      }

      .content ul:has(> li > input[type="checkbox"]) {
        list-style: none;
        padding-left: 0;
      }

      .content ul:has(> li > input[type="checkbox"]) > li {
        padding-left: 1.75em;
        text-indent: -1.75em;
      }

      .content ul:has(> li > input[type="checkbox"]) input[type="checkbox"] {
        margin-right: 0.5em;
        vertical-align: -3%;
      }

      .footer {
        border-top: 2px solid #6269c9;
        background: linear-gradient(180deg, #edf0ff 0%, #dce3ff 100%);
        color: #292d59;
      }

      .footer a {
        color: #292d59;
      }

      .theme-dark .footer {
        border-top-color: #969aff;
        background: linear-gradient(180deg, #28294f 0%, #17182f 100%);
        color: #e4e6ff;
      }

      .theme-dark .footer a {
        color: #c3c8ff;
      }

      @media screen and (max-width: 768px) {
        .is-flex-direction-column-reverse-mobile {
          flex-direction: column-reverse !important;
        }

        a#theme-toggle {
          display: block;
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="container mt-6" role="banner">
      <div class="columns">
        <aside class="column is-one-fifth">
        </aside>
        <h1 class="title column"><img src="{{ `favicon.svg` | relURL }}" alt="Castle tower" width="48" height="48" style="vertical-align: -30%;margin-left: 1.2em;"> Mdcoach</h1>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="columns is-flex is-flex-direction-column-reverse-mobile">
          <aside class="column is-one-quarter">
            <nav class="menu mt-3" aria-label="Documentation navigation">
              <p class="menu-label"><i>Beta</i> Documentation</p>
              <ul class="menu-list">
                {{ range site.Menus.main }}
                  <li><a class="{{ if $.IsMenuCurrent `main` . }}is-active{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a></li>
                {{ end }}
              </ul>
              <p class="menu-label">
                <a href="#theme" class="icon p-4" id="theme-toggle" type="button" aria-label="Use dark theme" title="Use dark theme" aria-pressed="false">
                  <span class="icon" id="theme-toggle-moon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <path fill="currentColor" d="M20.7 15.1A8.5 8.5 0 0 1 8.9 3.3 9 9 0 1 0 20.7 15.1Z"/>
                    </svg>
                  </span>
                  <span class="icon is-hidden" id="theme-toggle-sun" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                  </span>
                </a>
              </p>
            </nav>
          </aside>
          <article class="column content">
            {{ block "main" . }}{{ end }}
          </article>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="content has-text-centered">
        <p>
          <a href="https://github.com/dkotik/mdcoach" aria-label="Mdcoach on GitHub" title="Mdcoach on GitHub">
            Source Code
            <span class="icon" style="display: inline-box; max-width: 1em;">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.26c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.58A12 12 0 0 0 12 .5"/>
              </svg>
            </span>
          </a>
        </p>
      </div>
    </footer>

    <script>
      (() => {
        const root = document.documentElement
        const toggle = document.getElementById('theme-toggle')
        const moonIcon = document.getElementById('theme-toggle-moon')
        const sunIcon = document.getElementById('theme-toggle-sun')
        const savedTheme = localStorage.getItem('mdcoach-theme')

        if (savedTheme === 'dark' || savedTheme === 'light') {
          root.className = root.className.replace(/\btheme-(?:dark|light)\b/g, '').trim()
          root.classList.add(`theme-${savedTheme}`)
        }

        const updateThemeToggle = () => {
          const isDark = root.classList.contains('theme-dark')
          const label = isDark ? 'Use light theme' : 'Use dark theme'
          moonIcon.classList.toggle('is-hidden', isDark)
          sunIcon.classList.toggle('is-hidden', !isDark)
          toggle.setAttribute('aria-label', label)
          toggle.setAttribute('title', label)
          toggle.setAttribute('aria-pressed', String(isDark))
          toggle.classList.toggle('is-dark', isDark)
          toggle.classList.toggle('is-light', !isDark)
        }

        updateThemeToggle()
        toggle.addEventListener('click', () => {
          const nextTheme = root.classList.contains('theme-dark') ? 'light' : 'dark'
          root.classList.remove('theme-dark', 'theme-light')
          root.classList.add(`theme-${nextTheme}`)
          localStorage.setItem('mdcoach-theme', nextTheme)
          updateThemeToggle()
        })
      })()
    </script>
  </body>
</html>

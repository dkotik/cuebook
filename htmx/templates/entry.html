<article class="entry card cell" id="entry-{{.Index}}" data-entry-index="{{.Index}}" data-file="{{.File}}">
  <header class="card-header">
    <h2 class="card-header-title">{{.Title}}</h2>
  </header>
  {{template "entry-content.html" .}}
</article>
<div class="buttons entry-actions is-centered">
  <pre id="entry-cue-{{.Index}}" hidden>{{.CUESource}}</pre>
  <span class="muted" data-entry-copy-status role="status"></span>
  {{if .CanMove}}
  <button class="button" type="button" data-entry-copy="entry-cue-{{.Index}}" title="Copy entry as CUE">Copy</button>
  <button class="button" type="button" data-file-picker-open="entry-move-dialog" aria-haspopup="dialog" aria-controls="entry-move-dialog">Move</button>
  <!--<button class="button" type="button" data-entry-cut="entry-cue-{{.Index}}" data-file="{{.File}}" data-entry-index="{{.Index}}" data-cut-fingerprint="{{.CutFingerprint}}" title="Cut entry as CUE">Cut</button>-->
  {{end}}
  {{if .CanArchive}}
  <form class="entry-archive-form" action="{{route "/archive"}}" method="post" hx-post="{{route "/archive"}}" hx-target="#workspace" hx-swap="outerHTML">
    <input type="hidden" name="file" value="{{.File}}">
    <input type="hidden" name="entry" value="{{.Index}}">
    <button class="button" type="submit">Archive</button>
  </form>
  {{end}}
  <a href="{{route .FileURL}}" class="button" type="button is-primary" title="Back">Back</a>
</div>
{{if .CanMove}}{{template "entry-move-dialog.html" .}}{{end}}

{{if .Editing}}
  {{template "field-form.html" .}}
{{else}}
<div class="field field-item"{{if .HideLabel}} title="{{.Name}}"{{end}}>
  {{if not .HideLabel}}<span class="field-name label">{{.Name}}:</span>{{end}}
  <div class="field-item__value">
    {{if .ReadOnly}}
      <output>{{if .Secret}}••••••••{{else}}{{.Value}}{{end}}</output>
    {{else}}
      <button class="field-value-edit" type="button" aria-label="Edit {{.Name}} value" hx-get="{{route .EditURL}}" hx-target="closest .field-item" hx-swap="outerHTML">
        <output>{{if .Secret}}••••••••{{else}}{{.Value}}{{end}}</output>
      </button>
      {{if .ShowEditIcon}}
      <button class="button is-small is-ghost field-edit-button" type="button" aria-label="Edit {{.Name}}" title="Edit {{.Name}}" hx-get="{{route .EditURL}}" hx-target="closest .field-item" hx-swap="outerHTML">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16.5 16.5 4 20 7.5 7.5 20H4z"/>
          <path d="m14.5 6 3.5 3.5M4 20h4"/>
        </svg>
      </button>
      {{end}}
    {{end}}
  </div>
</div>
{{end}}

<h2 class="card-header-title"><a href="{{route .ItemURL}}" hx-get="{{route .ItemURL}}" hx-target="#workspace" hx-swap="innerHTML" hx-push-url="true">{{.Title}}</a></h2>
{{if .CanMove}}
<button class="card-header-icon entry-drag-handle" type="button" draggable="true" data-entry-drag-handle aria-label="Drag to move {{.Title}}" title="Drag to move {{.Title}}">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v18m0-18-3 3m3-3 3 3m-3 15-3-3m3 3 3-3M3 12h18m-18 0 3-3m-3 3 3 3m15-3-3-3m3 3-3 3"/>
  </svg>
</button>
{{end}}

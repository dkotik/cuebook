{{ $selector := . }}
<fieldset class="mt-4" data-file-selector>
  <legend class="label">{{.Legend}}</legend>
  {{range .Options}}
  <label class="radio is-block mb-3{{if and $selector.HighlightCurrent .Current}} has-text-danger{{end}}">
    <input type="radio" name="{{$selector.InputName}}" value="{{.Name}}"{{if and $selector.Required (not (and $selector.DisableCurrent .Current))}} required{{end}}{{if .Selected}} checked{{end}}{{if and $selector.DisableCurrent .Current}} disabled{{end}}>
    {{.Name}}{{if .Current}} (current file){{end}}
  </label>
  {{end}}
</fieldset>

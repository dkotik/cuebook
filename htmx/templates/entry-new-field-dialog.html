<dialog id="entry-new-field-dialog" class="file-selector-dialog" aria-labelledby="entry-new-field-title" aria-describedby="entry-new-field-description" data-file-picker-dialog>
  <form class="modal-card file-picker-card entry-new-field-form" action="{{if .UUID}}{{route "/add-field/uuid"}}{{else}}{{route "/add-field"}}{{end}}" method="post" hx-post="{{if .UUID}}{{route "/add-field/uuid"}}{{else}}{{route "/add-field"}}{{end}}" hx-target="#workspace" hx-swap="outerHTML" hx-disabled-elt="find button[type='submit']">
    <input type="hidden" name="file" value="{{.File}}">
    {{if .UUID}}<input type="hidden" name="uuid" value="{{.UUID}}">{{else}}<input type="hidden" name="entry" value="{{.Index}}">{{end}}
    <header class="modal-card-head">
      <h2 id="entry-new-field-title" class="modal-card-title">Add field</h2>
      <button class="delete" type="button" aria-label="Cancel adding a field" data-file-picker-dismiss></button>
    </header>
    <section class="modal-card-body">
      <p id="entry-new-field-description" class="mb-4">Add a field to “{{.Title}}”.</p>
      <div class="field">
        <label class="label" for="entry-new-field-name">Name</label>
        <div class="control">
          <input id="entry-new-field-name" class="input" type="text" name="name" required autocomplete="off" autofocus>
        </div>
      </div>
      <fieldset class="field">
        <legend class="label">Type</legend>
        <div class="control">
          {{- range .NewFieldKinds}}
          <label class="radio">
            <input type="radio" name="kind" value="{{.Value}}" required{{if .Checked}} checked{{end}}>
            {{.Label}}
          </label>
          {{- end}}
        </div>
      </fieldset>
      {{/* Each type has its own control and name; the server reads the one
           matching the chosen type, and CSS shows only that control. */}}
      <div class="field new-field-value" data-kind="string">
        <label class="label" for="entry-new-field-value-string">Value</label>
        <div class="control">
          <input id="entry-new-field-value-string" class="input" type="text" name="value_string" autocomplete="off" placeholder="...">
        </div>
      </div>
      <div class="field new-field-value" data-kind="multiline">
        <label class="label" for="entry-new-field-value-multiline">Value</label>
        <div class="control">
          <textarea id="entry-new-field-value-multiline" class="textarea" data-markdown-editor name="value_multiline" rows="4" placeholder="..."></textarea>
        </div>
      </div>
      <div class="field new-field-value" data-kind="number">
        <label class="label" for="entry-new-field-value-number">Value</label>
        <div class="control">
          <input id="entry-new-field-value-number" class="input" type="text" inputmode="decimal" name="value_number" autocomplete="off" placeholder="0">
        </div>
        <p class="help">Leave empty for 0.</p>
      </div>
      <fieldset class="field new-field-value" data-kind="boolean">
        <legend class="label">Value</legend>
        <div class="control">
          <label class="radio"><input type="radio" name="value_boolean" value="true"> True</label>
          <label class="radio"><input type="radio" name="value_boolean" value="false" checked> False</label>
        </div>
      </fieldset>
    </section>
    <footer class="modal-card-foot is-justify-content-flex-end buttons">
      <button class="button is-light" type="button" data-file-picker-dismiss>Cancel</button>
      <button class="button is-link" type="submit">Add field</button>
    </footer>
  </form>
</dialog>

<article class="entry card cell" id="entry-{{.Index}}" data-entry-index="{{.Index}}" data-file="{{.File}}" data-can-archive="{{.CanArchive}}">
  <header class="card-header">
    {{template "entry-heading.html" .}}
  </header>
  <div class="card-content">
    {{range .Fields}}{{template "field.html" .}}{{end}}
  </div>
</article>

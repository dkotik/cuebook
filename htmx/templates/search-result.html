<article class="entry card cell">
  <header class="card-header">
    <h2 class="card-header-title"><a href="{{route .URL}}" hx-get="{{route .URL}}" hx-target="#workspace" hx-swap="innerHTML" hx-push-url="true">{{.Title}}</a></h2>
  </header>
  <p class="search-result-path muted">{{.Path}}</p>
  {{if .Description}}
  <div class="card-content search-result-description">
    {{range .Description}}<p>{{.}}</p>{{end}}
  </div>
  {{end}}
</article>

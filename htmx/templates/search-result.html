<article class="entry card cell"{{if .CanMove}} data-entry-index="{{.Index}}" data-file="{{.File}}" data-entry-count="{{.EntryCount}}"{{end}}>
  <header class="card-header">
    {{template "entry-heading.html" .}}
  </header>
  <p class="search-result-path muted">{{.Path}}</p>
  {{if .Description}}
  <div class="card-content search-result-description">
    {{range .Description}}<p>{{.}}</p>{{end}}
  </div>
  {{end}}
</article>

<details class="add-entry-dock"{{if .AddError}} open{{end}}>
  <summary aria-controls="add-entry-dock-panel">Add entry</summary>
  <section class="add-entry box" id="add-entry-dock-panel" aria-labelledby="add-entry-heading">
    {{if .AddError}}<p class="notice notification is-danger add-entry-error" role="alert">{{.AddError}}</p>{{end}}
    <h2 id="add-entry-heading" class="title is-5">Add entry</h2>
    <form action="{{route "/add"}}" method="post" hx-post="{{route "/add"}}" hx-target="#workspace" hx-swap="outerHTML">
      <input type="hidden" name="file" value="{{.Selected}}">
      {{range .RequiredAddFields}}{{template "entry-add-field.html" .}}{{end}}
      {{range .OptionalAddFields}}{{template "entry-add-field.html" .}}{{end}}
      <button class="button is-link" type="submit">Add entry</button>
    </form>
  </section>
</details>

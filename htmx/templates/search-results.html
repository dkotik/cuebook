<section class="search-results" aria-label="Search results">
  <h2 class="menu-label">Results for “{{.Query}}”</h2>
  {{if .Results}}
  <div class="grid is-col-min-16 is-gap-2 entries-grid">
    {{range .Results}}{{template "search-result.html" .}}{{end}}
  </div>
  {{else}}
  <p class="muted">No search results.</p>
  {{end}}
</section>
